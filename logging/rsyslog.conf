# -----------------------------------------------------------------------------
# BioLab Analytics - central log server (Description.md section 6.2)
#
# Deliberate weaknesses:
#   - imudp (UDP/514): unauthenticated, unencrypted transport. Any host
#     that can reach this container on UDP/514 can inject log lines.
#   - Everything lands in ONE flat file, no per-service separation, no
#     rotation policy configured here (left to the OS default, effectively
#     unmanaged for this mockup), and no alerting/correlation rules at all.
# -----------------------------------------------------------------------------

module(load="imudp")
input(type="imudp" port="514")

module(load="imtcp")
input(type="imtcp" port="514")

# Everything, from everywhere, into a single flat file.
*.* /var/log/central.log

# Keep rsyslog's own status visible too.
*.* /var/log/rsyslog-status.log
